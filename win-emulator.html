<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroCore OS Emulator</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: black; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        #emulator-screen {
            width: 100%; max-width: 800px; height: 500px; background: #111; border: 2px solid #333;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .info { color: #00ff66; font-family: monospace; margin-top: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div id="emulator-screen">
        <!-- ตัวอย่างการเชื่อมต่อระบบจำลอง OS ภายนอกผ่าน iframe หรือ v86 Engine -->
        <iframe src="https://copy.sh/v86/?profile=windows98" title="Windows 98 Emulator"></iframe>
    </div>
    <div class="info">⚠️ กำลังจำลองระบบปฏิบัติการจริงผ่านเบราว์เซอร์มือถือ (WebAssembly Engine)</div>

</body>
</html>
