<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Checkers Arena - PocketCloud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.5; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #38bdf855; margin-bottom: 20px; text-align: left; }
        h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 10px; text-align: center; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px; text-align: center; }
        
        .checkers-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 320px;
            height: 320px;
            margin: 20px auto;
            border: 3px solid #334155;
            border-radius: 4px;
        }
        .c-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .c-light { background-color: #e2e8f0; }
        .c-dark { background-color: #334155; }
        
        .btn {
            background-color: #0284c7;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            width: 100%;
            text-align: center;
        }
        .btn:hover { background-color: #0ea5e9; }
        .btn-back { display: inline-block; background-color: #334155; color: #fff; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; margin-top: 15px; width: 100%; text-align: center; }
        .btn-back:hover { background-color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>♟️ Thai Checkers Arena</h1>
            <p>// เกมกระดานหมากฮอสไทยคลาสสิก ดวลสมอง 2 ผู้เล่น (โหมดซ้อมสนาม)</p>
            
            <h3 style="color: #38bdf8; font-size: 1rem; margin-bottom: 5px; text-align: center;">🏆 โหมดซ้อมมือชิงแชมป์ประเทศไทย</h3>
            <div class="checkers-board" id="board"></div>
            
            <button onclick="alert('เริ่มเกมซ้อมชิงแชมป์! ขอให้คว้าแชมป์ประเทศไทยครับ 555')" class="btn">🎯 เริ่มเกมจำลอง</button>
            <a href="index.html" class="btn-back">⬅️ กลับหน้าหลัก PocketCloud Hub</a>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const cell = document.createElement('div');
                cell.className = 'c-cell ' + ((r + c) % 2 === 0 ? 'c-light' : 'c-dark');
                if (r < 3 && (r + c) % 2 !== 0) cell.innerHTML = '⚪';
                if (r > 4 && (r + c) % 2 !== 0) cell.innerHTML = '🔴';
                board.appendChild(cell);
            }
        }
    </script>
</body>
</html>
