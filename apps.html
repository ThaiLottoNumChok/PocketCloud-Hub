<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MicroCore Apps</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .app-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .app-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px; }
        textarea { width: 100%; height: 100px; margin-top: 5px; box-sizing: border-box; }
        input { width: 100%; padding: 5px; margin-bottom: 5px; box-sizing: border-box; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .calc-grid button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>แอปพลิเคชันจำลองภายในระบบ</h2>
    <div class="app-container">
        <!-- Text Editor App -->
        <div class="app-box">
            <h3>📝 สมุดบันทึก (Notepad)</h3>
            <textarea id="notepad" placeholder="พิมพ์ข้อความที่นี่..."></textarea>
            <button onclick="saveNotepad()" style="margin-top: 5px; width: 100%;">Save</button>
        </div>

        <!-- Calculator App -->
        <div class="app-box">
            <h3>🔢 เครื่องคิดเลข (Calculator)</h3>
            <input type="text" id="calc-display" readonly>
            <div class="calc-grid">
                <button onclick="appendCalc('7')">7</button>
                <button onclick="appendCalc('8')">8</button>
                <button onclick="appendCalc('9')">9</button>
                <button onclick="appendCalc('+')">+</button>
                <button onclick="appendCalc('4')">4</button>
                <button onclick="appendCalc('5')">5</button>
                <button onclick="appendCalc('6')">6</button>
                <button onclick="appendCalc('-')">-</button>
                <button onclick="appendCalc('1')">1</button>
                <button onclick="appendCalc('2')">2</button>
                <button onclick="appendCalc('3')">3</button>
                <button onclick="appendCalc('*')">*</button>
                <button onclick="clearCalc()">C</button>
                <button onclick="appendCalc('0')">0</button>
                <button onclick="calculate()">=</button>
                <button onclick="appendCalc('/')">/</button>
            </div>
        </div>
    </div>

    <script>
        // โหลดข้อมูล Notepad เดิมถ้ามี
        window.addEventListener('DOMContentLoaded', () => {
            const savedText = localStorage.getItem('microcore_notepad');
            if (savedText) document.getElementById('notepad').value = savedText;
        });

        function saveNotepad() {
            const text = document.getElementById('notepad').value;
            localStorage.setItem('microcore_notepad', text);
            alert('✅ บันทึกข้อความลงหน่วยความจำเรียบร้อย!');
        }

        function appendCalc(val) { 
            const display = document.getElementById('calc-display');
            if(display.value === 'Error') display.value = '';
            display.value += val; 
        }

        function clearCalc() { 
            document.getElementById('calc-display').value = ''; 
        }

        function calculate() {
            const display = document.getElementById('calc-display');
            try {
                // กรองอักขระให้อนุญาตเฉพาะตัวเลขและเครื่องคำนวณพื้นฐานเพื่อความปลอดภัยแทนการใช้ eval ดิบๆ
                const sanitizedInput = display.value.replace(/[^0-9+\-*/().]/g, '');
                if (!sanitizedInput) return;
                let result = Function('return ' + sanitizedInput)();
                display.value = result;
            } catch {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
