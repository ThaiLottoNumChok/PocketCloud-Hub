#### 2. ไฟล์ฮาร์ดดิสก์และแกลเลอรี (`hdd_10.html` / ส่วนแกลเลอรี)
ใช้คีย์กลางตัวเดียวกัน พร้อมรองรับการกรองประเภทไฟล์และการซิงก์แบบเรียลไทม์[cite: 71]:

```html
<script>
    const STORAGE_KEY = 'pocketcloud_shared_files';[cite: 71]

    window.addEventListener('DOMContentLoaded', () => {
        loadUserFiles();
    });

    window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY) {
            loadUserFiles();
        }
    });

    function sanitizeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function loadUserFiles() {
        const container = document.getElementById('fileGridContainer') || document.getElementById('fileList') || document.getElementById('galleryContainer');
        if (!container) return;

        let userFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');[cite: 71]
        
        if (container.id === 'galleryContainer') {
            let html = '';
            userFiles.forEach(f => {
                if (f.isImage && f.data) {
                    html += `<img src="${f.data}" class="gallery-item" alt="${sanitizeHTML(f.name)}">`;[cite: 71]
                }
            });
            container.innerHTML = html;
            return;
        }

        let html = `
            <div class="file-item">
                <div class="file-icon-box">📁</div>
                <div class="file-name">System_Core</div>
                <span style="font-size:0.75rem; color:#64748b;">ระบบ</span>
            </div>
        `;

        userFiles.forEach((f, index) => {
            let iconContent = '📄';
            if (f.isImage && f.data) {
                iconContent = `<img src="${f.data}" alt="${sanitizeHTML(f.name)}" style="width:100%; height:100%; object-fit:cover;">`;[cite: 71]
            }

            const safeName = sanitizeHTML(f.name);[cite: 71]
            html += `
                <div class="file-item">
                    <div class="file-icon-box" ${f.isImage ? `onclick="openImage('${f.data}')"` : `onclick="alert('📄 ไฟล์ข้อความ: ${safeName}')"`}>
                        ${iconContent}
                    </div>
                    <div class="file-name" title="${safeName}">${safeName}</div>
                    <button class="btn-danger" onclick="deleteUserFile(${index})">🗑️ ลบ</button>
                </div>
            `;[cite: 71]
        });

        container.innerHTML = html;
        
        const storageDisplay = document.getElementById('storageUsed');
        if (storageDisplay) {
            const totalBytes = new Blob([localStorage.getItem(STORAGE_KEY) || '']).size;[cite: 71]
            const totalKB = (totalBytes / 1024).toFixed(2);
            storageDisplay.innerText = `ไฟล์ทั้งหมด: ${userFiles.length} ไฟล์ | ใช้พื้นที่ไป: ${totalKB} KB / ~5,000 KB`;[cite: 71]
        }
    }

    function deleteUserFile(index) {
        let userFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');[cite: 71]
        if (confirm('คุณต้องการลบไฟล์นี้ใช่หรือไม่?')) {
            userFiles.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userFiles));[cite: 71]
            loadUserFiles();
        }
    }
</script>
