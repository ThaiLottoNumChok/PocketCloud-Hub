<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketCloud - หน้าหลัก</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: #0f172a;
        }
        .upload-box {
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .gallery-item {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>☁️ PocketCloud - แกลเลอรีไฟล์ภาพ</h1>
        
        <div class="upload-box">
            <input type="file" id="imageInput" accept="image/*" multiple>
        </div>

        <div id="galleryContainer" class="gallery-grid">
            <!-- รูปภาพจะแสดงผลที่นี่อัตโนมัติ -->
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'pocketcloud_shared_files';

        function loadGallery() {
            const galleryContainer = document.getElementById('galleryContainer');
            if (!galleryContainer) return;
            const sharedFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            let html = '';
            
            sharedFiles.forEach(f => {
                if (f.isImage && f.data) {
                    html += `<img src="${f.data}" class="gallery-item" alt="${f.name}">`;
                }
            });
            galleryContainer.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadGallery);

        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                loadGallery();
            }
        });

        const imageInput = document.getElementById('imageInput');
        if (imageInput) {
            imageInput.addEventListener('change', function(event) {
                const files = event.target.files;
                let sharedFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.size > 1024 * 1024) {
                        alert(`❌ ไฟล์ "${file.name}" มีขนาดใหญ่เกินไป (จำกัดไม่เกิน 1MB)`);
                        continue;
                    }
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        sharedFiles.push({
                            name: file.name,
                            data: e.target.result,
                            isImage: true
                        });
                        try {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(sharedFiles));
                            loadGallery();
                        } catch (err) {
                            alert('⚠️ พื้นที่จัดเก็บเต็ม (Storage Full)');
                        }
                    }
                    reader.readAsDataURL(file);
                }
            });
        }
    </script>
</body>
</html>
