<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopee Hub ☁️🛍️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0284c7;
            margin-bottom: 5px;
            text-align: center;
            font-size: 22px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
        }
        .section-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        h2 {
            font-size: 18px;
            color: #0f172a;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .btn {
            background-color: #ee4d2d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #d73211; }
        
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        /* สไตล์รายการสินค้า */
        .link-item {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
        }
        .link-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;             /* ให้ขยายกินพื้นที่ส่วนที่เหลือเต็มที่ */
            min-width: 0;        /* ป้องกันไม่ให้ flex item ดันจนล้น */
        }
        .product-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            flex-shrink: 0;
        }
        .product-title {
            color: #1e293b;
            font-weight: bold;
            font-size: 14px;
            word-break: break-word; /* ตัดคำไม่ให้ตัวหนังสือล้นพ้น */
            display: -webkit-box;
            -webkit-line-clamp: 2;  /* แสดงผลสูงสุด 2 บรรทัดแล้วตัด (...) */
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        
        /* ปุ่มกดไปดูสินค้า */
        .visit-btn {
            background-color: #ee4d2d;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .visit-btn:hover {
            background-color: #d73211;
        }

        /* ปุ่มลบสินค้าสำหรับแอดมิน */
        .del-btn {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .del-btn:hover { background-color: #fecaca; }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        #admin-section {
            display: none; 
        }
        .toggle-admin {
            text-align: right;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="toggle-admin" onclick="toggleAdminMode()">⚙️ โหมดจัดการร้านค้า</div>
        
        <h1>🛍️ Shopee Hub & Recommended</h1>
        <p class="subtitle">รวมสินค้าแนะนำและลิงก์โปรโมชั่นพิเศษ</p>
        
        <!-- ส่วนเพิ่มลิงก์ (เฉพาะแอดมิน) -->
        <div class="section-box" id="admin-section">
            <h2>🛒 เพิ่มลิงก์สินค้า Shopee (แอดมิน)</h2>
            <div class="form-group">
                <label>ชื่อสินค้า / ป้ายกำกับ:</label>
                <input type="text" id="linkTitle" placeholder="เช่น ผลไม้ดอง 500 กรัม">
            </div>
            <div class="form-group">
                <label>เลือกหมวดหมู่:</label>
                <select id="linkCategory">
                    <option value="food">🍲 อาหารและเครื่องดื่ม</option>
                    <option value="home">🏠 เครื่องใช้ในบ้าน</option>
                    <option value="beauty">✨ ความงามและของใช้ส่วนตัว</option>
                    <option value="hobby">📚 เครื่องเขียน หนังสือและงานอดิเรก</option>
                    <option value="health">💊 กลุ่มผลิตภัณฑ์เพื่อสุขภาพ</option>
                </select>
            </div>
            <div class="form-group">
                <label>ลิงก์สินค้า (URL):</label>
                <input type="url" id="linkUrl" placeholder="https://shope.ee/xxxxxx">
            </div>
            <div class="form-group">
                <label>ลิงก์รูปภาพสินค้า (Image URL):</label>
                <input type="text" id="linkImg" placeholder="วางลิงก์รูปภาพสินค้า">
            </div>
            <button class="btn" onclick="addNewProduct()">➕ เพิ่มสินค้าเข้าหน้าเว็บ</button>
        </div>

        <!-- พื้นที่แสดงรายชื่อลิงก์แยกตามหมวดหมู่ -->
        <div class="section-box" style="text-align: left;">
            <h2>📂 หมวดหมู่สินค้าทั้งหมด</h2>
            
            <div style="margin-bottom: 15px;">
                <h3 style="color: #0284c7; font-size: 15px; margin-bottom: 5px;">🍲 อาหารและเครื่องดื่ม</h3>
                <div id="list-food"></div>
            </div>
            <div style="margin-bottom: 15px;">
                <h3 style="color: #0284c7; font-size: 15px; margin-bottom: 5px;">🏠 เครื่องใช้ในบ้าน</h3>
                <div id="list-home"></div>
            </div>
            <div style="margin-bottom: 15px;">
                <h3 style="color: #0284c7; font-size: 15px; margin-bottom: 5px;">✨ ความงามและของใช้ส่วนตัว</h3>
                <div id="list-beauty"></div>
            </div>
            <div style="margin-bottom: 15px;">
                <h3 style="color: #0284c7; font-size: 15px; margin-bottom: 5px;">📚 เครื่องเขียน หนังสือและงานอดิเรก</h3>
                <div id="list-hobby"></div>
            </div>
            <div style="margin-bottom: 15px;">
                <h3 style="color: #0284c7; font-size: 15px; margin-bottom: 5px;">💊 กลุ่มผลิตภัณฑ์เพื่อสุขภาพ</h3>
                <div id="list-health"></div>
            </div>
        </div>
    </div>

    <script>
        let publicProducts = JSON.parse(localStorage.getItem('public_shopee_products') || JSON.stringify([
            {
                id: 1,
                title: "ผลไม้ดอง ขนาด 500 กรัม แถมฟรีพริกเกลือ",
                category: "food",
                url: "https://shopee.co.th",
                imgSrc: ""
            }
        ]));

        let isAdmin = false;

        function renderProducts() {
            const categories = ['food', 'home', 'beauty', 'hobby', 'health'];
            categories.forEach(cat => {
                document.getElementById(`list-${cat}`).innerHTML = '';
            });

            publicProducts.forEach(item => {
                const container = document.getElementById(`list-${item.category}`);
                if (container) {
                    const div = document.createElement('div');
                    div.className = 'link-item';
                    
                    let imgTag = item.imgSrc ? `<img src="${item.imgSrc}" class="product-thumb">` : `<div class="product-thumb" style="display:flex;align-items:center;justify-content:center;background:#e2e8f0;font-size:10px;color:#64748b;">📦 Shopee</div>`;
                    
                    let deleteBtnTag = isAdmin ? `<button class="del-btn" onclick="deleteProduct(${item.id})">🗑️ ลบ</button>` : '';

                    div.innerHTML = `
                        <div class="link-info">
                            ${imgTag}
                            <div class="product-title">${item.title}</div>
                        </div>
                        <div class="action-buttons">
                            <a href="${item.url}" target="_blank" class="visit-btn">🔗 ไปที่สินค้า</a>
                            ${deleteBtnTag}
                        </div>
                    `;
                    container.appendChild(div);
                }
            });
        }

        function toggleAdminMode() {
            const pass = prompt("กรุณากรอกรหัสผ่านผู้ดูแลระบบ:");
            if (pass === "44104545") {
                isAdmin = !isAdmin;
                const adminBox = document.getElementById('admin-section');
                adminBox.style.display = isAdmin ? 'block' : 'none';
                renderProducts();
                alert(isAdmin ? "เปิดโหมดแอดมินสำเร็จ (สามารถเพิ่ม/ลบสินค้าได้)" : "ปิดโหมดแอดมินแล้ว");
            } else if (pass !== null) {
                alert("รหัสผ่านไม่ถูกต้อง!");
            }
        }

        function addNewProduct() {
            const title = document.getElementById('linkTitle').value.trim();
            const category = document.getElementById('linkCategory').value;
            const url = document.getElementById('linkUrl').value.trim();
            const imgSrc = document.getElementById('linkImg').value.trim();

            if (!title || !url) {
                alert('กรุณากรอกชื่อสินค้าและลิงก์ด้วยครับ!');
                return;
            }

            publicProducts.push({ id: Date.now(), title, category, url, imgSrc });
            localStorage.setItem('public_shopee_products', JSON.stringify(publicProducts));
            
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkImg').value = '';
            
            renderProducts();
            alert('เพิ่มสินค้าสำเร็จ!');
        }

        function deleteProduct(id) {
            if (confirm('คุณต้องการลบสินค้านี้ใช่หรือไม่?')) {
                publicProducts = publicProducts.filter(item => item.id !== id);
                localStorage.setItem('public_shopee_products', JSON.stringify(publicProducts));
                renderProducts();
            }
        }

        renderProducts();
    </script>
</body>
</html>
