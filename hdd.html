<script>
    const STORAGE_KEY = 'pocketcloud_shared_files';

    window.addEventListener('DOMContentLoaded', () => {
        loadUserFiles();
    });

    window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY) {
            loadUserFiles();
        }
    });

    function sanitizeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function handleFileUpload(event) {
        const files = event.target.files;
        let userFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        let processedCount = 0;
        for (let i = 0; i < files.length; i++) {
            const file = files[i];

            if (file.size > 1024 * 1024) {
                alert(`❌ ไฟล์ "${file.name}" มีขนาดใหญ่เกินไป (จำกัดไม่เกิน 1MB ต่อไฟล์)`);
                continue;
            }

            const isImage = file.type.startsWith('image/');
            const isText = file.type === 'text/plain' || file.name.endsWith('.txt');

            if (!isImage && !isText) {
                alert(`❌ ไม่อนุญาตให้อัปโหลดไฟล์ประเภทนี้: ${file.name}`);
                continue;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    userFiles.push({
                        name: file.name,
                        data: e.target.result,
                        isImage: isImage
                    });
                    processedCount++;
                    
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(userFiles));
                    loadUserFiles();
                } catch (error) {
                    alert('⚠️ พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม (Quota Exceeded)');
                }
            };
            reader.readAsDataURL(file);
        }
        if(processedCount > 0) {
            alert('✅ อัปโหลดไฟล์สำเร็จ!');
        }
    }

    function loadUserFiles() {
        const container = document.getElementById('fileGridContainer');
        if (!container) return;

        let userFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        let html = `
            <div class="file-item">
                <div class="file-icon-box">📁</div>
                <div class="file-name">System_Core</div>
                <span style="font-size:0.75rem; color:#64748b;">ระบบ</span>
            </div>
        `;

        userFiles.forEach((f, index) => {
            let iconContent = '📄';
            if (f.isImage && f.data) {
                iconContent = `<img src="${f.data}" alt="${sanitizeHTML(f.name)}" style="width:100%; height:100%; object-fit:cover;">`;
            }

            const safeName = sanitizeHTML(f.name);
            html += `
                <div class="file-item">
                    <div class="file-icon-box" ${f.isImage ? `onclick="openImage('${f.data}')"` : `onclick="alert('📄 ไฟล์ข้อความ: ${safeName}')"`}>
                        ${iconContent}
                    </div>
                    <div class="file-name" title="${safeName}">${safeName}</div>
                    <button class="btn-danger" onclick="deleteUserFile(${index})">🗑️ ลบ</button>
                </div>
            `;
        });

        container.innerHTML = html;
        
        const storageDisplay = document.getElementById('storageUsed');
        if (storageDisplay) {
            const totalBytes = new Blob([localStorage.getItem(STORAGE_KEY) || '']).size;
            const totalKB = (totalBytes / 1024).toFixed(2);
            storageDisplay.innerText = `ไฟล์ทั้งหมด: ${userFiles.length} ไฟล์ | ใช้พื้นที่ไป: ${totalKB} KB / ~5,000 KB`;
        }
    }

    function openImage(dataUrl) {
        const modalImg = document.getElementById('modalImg');
        const imageModal = document.getElementById('imageModal');
        if (modalImg && imageModal) {
            modalImg.src = dataUrl;
            imageModal.style.display = 'flex';
        }
    }

    function deleteUserFile(index) {
        let userFiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (confirm('คุณต้องการลบไฟล์นี้ใช่หรือไม่?')) {
            userFiles.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userFiles));
            loadUserFiles();
        }
    }
</script>
