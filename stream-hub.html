<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Hub - PocketCloud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #3b82f655; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: #60a5fa; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px; }
        
        /* ส่วนจำลองหน้าจอแสดงผล (Preview Canvas) */
        .preview-container { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 8px; overflow: hidden; border: 2px solid #334155; margin-bottom: 15px; }
        #webcamVideo { width: 100%; height: 100%; object-fit: cover; }
        
        /* ข้อความวิ่งทับหน้าจอ (Overlay Text) */
        .overlay-text { position: absolute; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.6); color: #38bdf8; padding: 5px 12px; border-radius: 4px; font-size: 1rem; font-weight: bold; pointer-events: none; }
        
        .control-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { background-color: #2563eb; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .btn:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #334155; }
        .btn-secondary:hover { background-color: #475569; }
        
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 0.9rem; }
        
        .btn-back { display: inline-block; background-color: #334155; color: #fff; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; width: 100%; text-align: center; }
        .btn-back:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎙️ Stream Hub (Web Studio)</h1>
            <p>// ระบบจำลองพรีวิวกล้องและซ้อนทับข้อความบนหน้าเว็บ</p>
            
            <!-- หน้าจอพรีวิวหลัก -->
            <div class="preview-container">
                <video id="webcamVideo" autoplay playsinline muted></video>
                <div id="displayOverlay" class="overlay-text">PocketCloud Live Stream</div>
            </div>

            <!-- แผงควบคุม -->
            <div class="control-group">
                <button class="btn" id="startCamBtn">เปิดกล้อง</button>
                <button class="btn btn-secondary" id="stopCamBtn">ปิดกล้อง</button>
            </div>

            <div class="control-group">
                <input type="text" id="textInput" placeholder="พิมพ์ข้อความซ้อนทับหน้าจอที่นี่..." value="PocketCloud Live Stream">
                <button class="btn" id="updateTextBtn">เปลี่ยนข้อความ</button>
            </div>
            
            <a href="index.html" class="btn-back">⬅️ กลับหน้าหลัก PocketCloud Hub</a>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcamVideo');
        const startCamBtn = document.getElementById('startCamBtn');
        const stopCamBtn = document.getElementById('stopCamBtn');
        const textInput = document.getElementById('textInput');
        const updateTextBtn = document.getElementById('updateTextBtn');
        const displayOverlay = document.getElementById('displayOverlay');

        let mediaStream = null;

        // ฟังก์ชันเปิดกล้องเว็บแคม
        startCamBtn.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                videoElement.srcObject = mediaStream;
            } catch (err) {
                alert('ไม่สามารถเปิดใช้งานกล้องได้ กรุณาตรวจสอบสิทธิ์การเข้าถึง: ' + err.message);
            }
        });

        // ฟังก์ชันปิดกล้อง
        stopCamBtn.addEventListener('click', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }
        });

        // ฟังก์ชันอัปเดตข้อความซ้อนทับ
        updateTextBtn.addEventListener('click', () => {
            const val = textInput.value.trim();
            displayOverlay.innerText = val !== '' ? val : 'PocketCloud Live Stream';
        });
    </script>
</body>
</html>
