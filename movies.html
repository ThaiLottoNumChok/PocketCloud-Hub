<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiLottoStream - Universal Player & Media Studio</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --primary: #38bdf8;
            --bg-app: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }
        body {
            margin: 0;
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 60px;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 20px;
            font-weight: 800;
        }
        .container {
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
        }
        .player-box {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 25px;
            background: #000;
            aspect-ratio: 16 / 9;
            position: relative;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: #000;
        }
        .card-box {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .card-box label {
            font-size: 13px;
            color: var(--primary);
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        .input-group input, .input-group select {
            flex: 1;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-action {
            background: var(--primary);
            color: var(--bg-app);
            border: none;
            padding: 0 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-success { background: var(--accent); color: #fff; }
        
        .upload-section {
            border: 2px dashed #475569;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
            background: var(--bg-card);
        }
        .upload-section:hover { border-color: var(--primary); background: #223049; }
        .upload-section input { display: none; }

        .search-box {
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .search-input:focus { outline: none; border-color: var(--primary); }
        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .movie-card {
            background: var(--bg-card);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .movie-card:hover {
            border-color: var(--primary);
            background: #273548;
        }
        .movie-thumb {
            width: 90px;
            height: 55px;
            background: linear-gradient(135deg, #1e293b, #334155);
            border-radius: 6px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid #475569;
        }
        .movie-info {
            flex: 1;
            min-width: 0;
        }
        .movie-info h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: #fff;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-info span {
            font-size: 12px;
            color: var(--text-sub);
        }
        .play-btn {
            background: var(--primary);
            color: var(--bg-app);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-btn:hover { color: var(--primary); }
        .status-text { font-size: 12px; color: var(--text-sub); margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h2>ThaiLottoStream Media Studio</h2>
    </div>

    <div class="container">
        <!-- 1. พื้นที่แสดงผลจอเล่นวิดีโอ -->
        <div class="player-box" id="playerContainer">
            <video id="plyrPlayer" playsinline controls>
                <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
            </video>
        </div>

        <!-- 2. ฟีเจอร์อัปโหลดไฟล์วิดีโอจากเครื่องมาเล่นทันที -->
        <label class="upload-section" for="localVideoInput">
            <div style="font-size: 24px; margin-bottom: 5px;">📁</div>
            <div style="font-weight: 700; font-size: 14px; color: #fff;">คลิกเพื่ออัปโหลดไฟล์วิดีโอในเครื่องมาเล่น</div>
            <div style="font-size: 12px; color: var(--text-sub);">รองรับไฟล์ MP4, WEBM, MKV</div>
            <input type="file" id="localVideoInput" accept="video/*" onchange="playLocalFile(event)">
        </label>

        <!-- 3. ช่องกรอก URL (รองรับ MP4 และ YouTube) -->
        <div class="card-box">
            <label>🔗 วางลิงก์วิดีโอออนไลน์ (MP4 หรือ YouTube):</label>
            <div class="input-group">
                <input type="text" id="customUrlInput" placeholder="วางลิงก์ที่นี่...">
                <button class="btn-action" onclick="playUniversalUrl()">เล่นลิงก์</button>
            </div>
        </div>

        <!-- 4. ฟีเจอร์จำลองการแปลงไฟล์ / สกัดเสียง และปุ่มดาวน์โหลด -->
        <div class="card-box" style="border-color: var(--accent);">
            <label style="color: var(--accent);">⚡ เครื่องมือแปลงไฟล์และดาวน์โหลดสื่อ (Media Converter)</label>
            <div class="input-group" style="margin-bottom: 10px;">
                <select id="convertType">
                    <option value="extract_audio">สกัดเสียงจากวิดีโอ (.mp3 / .wav)</option>
                    <option value="optimize_web">ปรับขนาด/บีบอัดวิดีโอสำหรับเว็บ (.mp4)</option>
                </select>
                <button class="btn-action btn-success" onclick="processConversion()">เริ่มแปลงไฟล์</button>
            </div>
            <div class="status-text" id="convertStatus">สถานะ: พร้อมแปลงไฟล์ (ประมวลผลบนเบราว์เซอร์)</div>
            <div id="downloadArea" style="text-align: center; margin-top: 10px;"></div>
        </div>

        <!-- ช่องค้นหา -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาหนัง..." onkeyup="searchMovies()">
        </div>

        <div style="font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 12px;">🎞️ รายการภาพยนตร์แนะนำ</div>
        
        <!-- รายการหนัง -->
        <div class="movie-list" id="movieList">
            <div class="movie-card" onclick="changeMovie('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'mp4')">
                <div class="movie-thumb">🐰</div>
                <div class="movie-info">
                    <h4>Big Buck Bunny</h4>
                    <span>ไฟล์ตรง • MP4</span>
                </div>
                <button class="play-btn">เล่น</button>
            </div>

            <div class="movie-card" onclick="changeMovie('https://www.youtube.com/embed/5qap5aO4i9A', 'youtube')">
                <div class="movie-thumb">▶️</div>
                <div class="movie-info">
                    <h4>Lofi Girl (YouTube Stream)</h4>
                    <span>สตรีมมิ่ง • YouTube</span>
                </div>
                <button class="play-btn">เล่น</button>
            </div>
        </div>

        <a href="index.html" class="back-btn">🏠 กลับสู่หน้าหลักเว็บไซต์</a>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        let player = new Plyr('#plyrPlayer');
        let currentLoadedFile = null; // เก็บข้อมูลไฟล์ปัจจุบันที่อัปโหลด

        function changeMovie(url, type) {
            const container = document.getElementById('playerContainer');
            currentLoadedFile = null; // รีเซ็ตไฟล์เครื่อง
            
            if (type === 'youtube') {
                container.innerHTML = `<iframe src="${url}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
            } else {
                container.innerHTML = `<video id="plyrPlayer" playsinline controls><source id="videoSource" src="${url}" type="video/mp4"></video>`;
                player = new Plyr('#plyrPlayer');
                player.play();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // เล่นไฟล์จากเครื่องผู้ใช้
        function playLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            currentLoadedFile = file; // บันทึกไฟล์ไว้ใช้แปลง
            const fileURL = URL.createObjectURL(file);
            const container = document.getElementById('playerContainer');
            
            container.innerHTML = `<video id="plyrPlayer" playsinline controls><source src="${fileURL}" type="${file.type}"></video>`;
            player = new Plyr('#plyrPlayer');
            player.play();

            document.getElementById('convertStatus').innerText = `สถานะ: โหลดไฟล์ "${file.name}" เรียบร้อย พร้อมแปลงไฟล์`;
            document.getElementById('downloadArea').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function playUniversalUrl() {
            let input = document.getElementById('customUrlInput').value.trim();
            if (!input) {
                alert('กรุณาวางลิงก์ก่อนครับ!');
                return;
            }

            if (input.includes('youtube.com') || input.includes('youtu.be')) {
                let videoId = '';
                if (input.includes('youtu.be/')) {
                    videoId = input.split('youtu.be/')[1].split('?')[0];
                } else if (input.includes('watch?v=')) {
                    videoId = input.split('watch?v=')[1].split('&')[0];
                } else if (input.includes('/embed/')) {
                    videoId = input.split('/embed/')[1].split('?')[0];
                }
                
                if (videoId) {
                    changeMovie(`https://www.youtube.com/embed/${videoId}`, 'youtube');
                } else {
                    alert('ลิงก์ YouTube ไม่ถูกต้องครับ');
                }
            } else {
                changeMovie(input, 'mp4');
            }
        }

        // จำลองระบบการแปลงไฟล์และสร้างลิงก์ดาวน์โหลด
        function processConversion() {
            if (!currentLoadedFile) {
                alert('กรุณาอัปโหลดไฟล์วิดีโอก่อนกดแปลงไฟล์ครับพี่เจมส์!');
                return;
            }

            const type = document.getElementById('convertType').value;
            const statusText = document.getElementById('convertStatus');
            const downloadArea = document.getElementById('downloadArea');

            statusText.innerText = 'สถานะ: กำลังประมวลผลไฟล์ในเบราว์เซอร์...';
            downloadArea.innerHTML = '';

            setTimeout(() => {
                statusText.innerText = 'สถานะ: แปลงไฟล์สำเร็จ! พร้อมดาวน์โหลด';
                
                // สร้างลิงก์จำลองการดาวน์โหลดผลลัพธ์จากไฟล์ที่อัปโหลดมา
                let outputBlob = currentLoadedFile;
                let outputExt = type === 'extract_audio' ? '.mp3' : '_optimized.mp4';
                let outputName = currentLoadedFile.name.substring(0, currentLoadedFile.name.lastIndexOf('.')) + outputExt;
                
                let blobUrl = URL.createObjectURL(outputBlob);

                downloadArea.innerHTML = `
                    <a href="${blobUrl}" download="${outputName}" style="display: inline-block; background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;">
                        📥 คลิกดาวน์โหลดไฟล์ผลลัพธ์ (${outputName})
                    </a>
                `;
            }, 1500);
        }

        function searchMovies() {
            let filter = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('movie-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h4')[0].innerText.toLowerCase();
                cards[i].style.display = title.indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>
</body>
</html>
